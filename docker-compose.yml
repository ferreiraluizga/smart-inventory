services:
  postgres:
    image: postgres:14
    container_name: postgres-db
    restart: always

    environment:
      POSTGRES_DB: smartinventory
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: